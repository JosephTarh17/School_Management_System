<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Institutional Excellence - School Management System</title>
    <script src="https://unpkg.com/cinetpay-seamless@0.1.5/dist/cinetpay-seamless.umd.cjs" defer></script>
    <!-- Preconnect for fast parallel font fetching -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <style>
      @keyframes sms-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-surface-bg text-on-surface antialiased">
    <div id="app">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:Inter,Arial,sans-serif;color:#0f172a;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;">
          <div style="width:40px;height:40px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:9999px;animation:sms-spin 0.8s linear infinite;"></div>
          <div>
            <strong style="display:block;font-size:14px;">Loading Scholastic</strong>
            <span style="display:block;margin-top:4px;font-size:12px;color:#64748b;">Restoring your secure session.</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
